<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 900"><rect width="1500" height="900" fill="#fff"/><g font-family="sans-serif" fill="#111"><text x="30" y="42" font-size="26" font-weight="700">DANBAEK BODY PARAMETERS → CANON RENDERER MAP</text><text x="30" y="72" font-size="15">이 문서는 새 디자인 시트가 아니라 이미 LOCKED된 성장 아트를 코드에 연결하기 위한 시각 명세다.</text></g><g stroke="#111" fill="#fff" stroke-width="2"><rect x="40" y="120" width="360" height="660" rx="18"/><rect x="570" y="120" width="360" height="660" rx="18"/><rect x="1100" y="120" width="360" height="660" rx="18"/></g><g font-family="sans-serif" fill="#111"><text x="220" y="155" text-anchor="middle" font-size="20" font-weight="700">DanbaekBodyParameters</text><text x="750" y="155" text-anchor="middle" font-size="20" font-weight="700">CANON 적용 규칙</text><text x="1280" y="155" text-anchor="middle" font-size="20" font-weight="700">화면 결과</text><g font-size="17"><text x="80" y="205">chest</text><text x="80" y="245">shoulder</text><text x="80" y="285">arm</text><text x="80" y="325">back</text><text x="80" y="365">waist</text><text x="80" y="405">abs</text><text x="80" y="445">glute</text><text x="80" y="485">thigh</text><text x="80" y="525">calf</text><text x="80" y="565">overallMass</text><text x="80" y="605">fatSoftness</text><text x="80" y="645">definition</text></g><g font-size="16"><text x="610" y="205">가슴 CANON 성장선</text><text x="610" y="245">어깨 폭/곡선 CANON</text><text x="610" y="285">팔 두께/근육선 CANON</text><text x="610" y="325">등 폭/선 CANON</text><text x="610" y="365">기존 실루엣 범위 내 허리 보정</text><text x="610" y="405">복근 CANON 단계</text><text x="610" y="445">하체 CANON 범위 내 보정</text><text x="610" y="485">하체 CANON 범위 내 보정</text><text x="610" y="525">하체 CANON 범위 내 보정</text><text x="610" y="565">Lv.1~10 전체 볼륨 방향</text><text x="610" y="605">선/경계 부드러움만 조절</text><text x="610" y="645">근육 분리선만 조절</text></g></g><g stroke="#111" stroke-width="3" fill="none"><path d="M410 450 H550"/><path d="M940 450 H1080"/></g><path d="M545 440 L565 450 L545 460 Z M1075 440 L1095 450 L1075 460 Z" fill="#111"/><image href="stages/danbaek_stage_07.svg" x="1160" y="220" width="240" height="420"/><g font-family="sans-serif" fill="#111" font-size="15"><text x="1150" y="700">핵심: 파라미터가 올라가도 새로운 단백이를 만들지 않는다.</text><text x="1150" y="730">항상 CANON 실루엣·얼굴·선화·성장 방향 안에서만 변화.</text><text x="40" y="835" font-size="18" font-weight="700">LOCKED 우선순위</text><text x="40" y="865">기존 시스템 → 사용자 CANON 이미지 → 현재 프로젝트 구조 → 최소 변경. 충돌 시 임의 수정 금지.</text></g></svg>