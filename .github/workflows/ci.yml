name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Verify streak
        run: npm run verify:streak

      - name: Verify session
        run: npm run verify:session

      - name: Verify weight core
        run: npm run verify:weight-core

      - name: Verify workout core
        run: npm run verify:workout-core

      - name: Verify growth
        run: npm run verify:growth

      - name: Verify body
        run: npm run verify:body

      - name: Verify character body
        run: npm run verify:character-body

      - name: Verify growth reveal
        run: npm run verify:growth-reveal

      - name: Verify workout character motion
        run: npm run verify:workout-character-motion

      - name: Verify core loop
        run: npm run verify:core-loop

      - name: Verify PT
        run: npm run verify:pt

      - name: Verify entitlement
        run: npm run verify:entitlement

      - name: Verify storage recovery
        run: npm run verify:storage

      - name: Verify monetization
        run: npm run verify:monetization

      - name: Verify release config
        run: npm run verify:release

      - name: Verify home gym gameplay
        run: npm run verify:home-gym
